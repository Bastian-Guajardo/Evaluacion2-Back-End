<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GamerHub | Eliminar Videojuego</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background: #0a0612; color: #f8f9fa; font-family: 'Rajdhani', sans-serif; }
        .font-gamer { font-family: 'Orbitron', sans-serif; }
        .danger-container { background: rgba(35, 10, 20, 0.9); border: 2px solid #dc3545; border-radius: 16px; }
    </style>
</head>
<body>
    <div class="container py-5 d-flex justify-content-center">
        <div class="col-md-6 danger-container p-5 text-center mt-5 shadow-lg">
            <h2 class="font-gamer text-danger mb-4">🚨 CONFIRMAR ELIMINACIÓN 🚨</h2>
            <p class="fs-5 mb-4">¿Estás completamente seguro de eliminar el videojuego <strong class="text-info">"{{ juego.titulo }}"</strong> del inventario permanente?</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-center">
                    <button type="submit" class="btn btn-danger px-5 font-gamer fw-bold">SÍ, ELIMINAR</button>
                    <a href="{% url 'lista_videojuegos' %}" class="btn btn-outline-light px-5 font-gamer fw-bold">ABORTAR</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
