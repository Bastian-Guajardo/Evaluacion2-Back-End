<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GamerShop | Catálogo de Videojuegos{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0b1220;
            --surface: #121a2c;
            --surface-2: #17233a;
            --border: #24314a;
            --text: #e7ebf3;
            --text-muted: #90a0b8;
            --primary: #4f7cff;
            --primary-dark: #3a63e0;
            --accent: #22c55e;
            --danger: #ef4444;
            --warning: #f5a623;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Sora', sans-serif;
        }

        a { text-decoration: none; }

        /* Navbar */
        .navbar-custom {
            background: rgba(11, 18, 32, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.45rem;
            color: var(--text) !important;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .brand-logo i { color: var(--primary); }

        /* Buttons */
        .btn-primary-custom {
            background: var(--primary);
            border: 1px solid var(--primary);
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-primary-custom:hover { background: var(--primary-dark); color: #fff; transform: translateY(-1px); }

        .btn-outline-custom {
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-outline-custom:hover { border-color: var(--text-muted); color: var(--text); background: var(--surface-2); }

        .btn-edit-custom {
            border: 1px solid rgba(245, 166, 35, 0.5);
            color: var(--warning);
            font-weight: 600;
            border-radius: 8px;
            background: rgba(245, 166, 35, 0.1);
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-edit-custom:hover { background: var(--warning); color: #14100a; }

        .btn-delete-custom {
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: var(--danger);
            font-weight: 600;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.1);
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-delete-custom:hover { background: var(--danger); color: #fff; }

        /* Cards / containers */
        .surface-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        /* Cuadritos de juego en Blanco con letras negras */
        .game-horizontal-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            transition: all 0.25s ease;
        }

        .game-horizontal-card:hover {
            transform: translateY(-2px);
            border-color: #3b82f6 !important;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
        }

        .game-horizontal-card h3,
        .game-card h3 {
            color: #000000 !important;
        }

        .game-icon-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .game-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6 !important;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
        }

        /* Tabla Horizontal en Cuadro Blanco */
        .custom-table-container {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .custom-table {
            color: #0f172a;
            margin-bottom: 0;
            vertical-align: middle;
            width: 100%;
        }

        .custom-table thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        .custom-table thead th {
            color: #475569;
            font-family: 'Sora', sans-serif;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            padding: 16px 20px;
            border: none;
            white-space: nowrap;
        }

        .custom-table tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s ease;
        }

        .custom-table tbody tr:last-child {
            border-bottom: none;
        }

        .custom-table tbody tr:hover {
            background-color: rgba(59, 130, 246, 0.06);
        }

        .custom-table tbody td {
            padding: 16px 20px;
            border: none;
            white-space: nowrap;
        }

        .badge-platform {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 5px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .price-tag {
            font-family: 'Sora', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #000000 !important;
            white-space: nowrap;
        }

        .price-currency {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .empty-box {
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 20px;
            padding: 60px 40px;
        }

        /* Forms */
        .form-control, .form-select {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .form-control:focus, .form-select:focus {
            background: var(--surface-2);
            color: var(--text);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.2);
        }
        label { color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 6px; }

        .form-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .accent-bar {
            width: 64px;
            height: 4px;
            border-radius: 2px;
            background: var(--primary);
        }

        /* View switcher tabs */
        .view-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .view-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        footer {
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand brand-logo d-flex align-items-center" href="{% url 'lista_videojuegos' %}">
                <i class="bi bi-controller me-2 fs-4"></i>GamerShop
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'lista_videojuegos' %}" class="btn btn-outline-custom btn-sm px-3 d-none d-sm-inline-flex align-items-center">
                    <i class="bi bi-collection me-1"></i>Catálogo
                </a>
                <a href="{% url 'crear_videojuego' %}" class="btn btn-primary-custom btn-sm px-3 d-inline-flex align-items-center">
                    <i class="bi bi-plus-circle-fill me-1"></i>Agregar Videojuego
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="container py-4 text-center">
        GamerShop &middot; Catálogo y administración de videojuegos
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
